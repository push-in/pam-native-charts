name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict --no-check-lock
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: php -d auto_prepend_file=vendor/autoload.php tests/run.php
      - run: vendor/bin/phpstan analyse --no-progress
      # Charts ships as a plain Composer library (it builds on pam-native-canvas,
      # and plugins may only depend on the core SDK), so there is no plugin
      # manifest to validate; its typed IDL must still compile deterministically.
      - name: Library contracts
        run: |
          test ! -e pam-native.plugin.json
          vendor/bin/pam-native-plugin compile pam-native.idl.json "${RUNNER_TEMP}/idl-a"
          vendor/bin/pam-native-plugin compile pam-native.idl.json "${RUNNER_TEMP}/idl-b"
          diff -r "${RUNNER_TEMP}/idl-a" "${RUNNER_TEMP}/idl-b"
